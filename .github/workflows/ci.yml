name: CI

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Locate solution file
        shell: bash
        run: |
          echo "Searching for .sln..."
          SLN_PATH="$(find . -maxdepth 4 -type f -name '*.sln' | head -n 1)"
          if [ -z "$SLN_PATH" ]; then
            echo "ERROR: No .sln file found in repository."
            echo "Files in repo root:"
            ls -la
            exit 1
          fi
          echo "Found solution: $SLN_PATH"
          echo "SLN_PATH=$SLN_PATH" >> "$GITHUB_ENV"

      - name: Restore
        run: dotnet restore "${{ env.SLN_PATH }}"

      - name: Build
        run: dotnet build "${{ env.SLN_PATH }}" -c Release --no-restore

      - name: Test
        run: dotnet test "${{ env.SLN_PATH }}" -c Release --no-build --verbosity normal

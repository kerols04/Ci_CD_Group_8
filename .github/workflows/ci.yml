name: CI

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        run: dotnet restore Personnummer.sln

      - name: Build
        run: dotnet build Personnummer.sln -c Release --no-restore

      - name: Test
        run: dotnet test Personnummer.sln -c Release --no-build --verbosity normal
